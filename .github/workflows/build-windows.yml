name: Build for Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Pre-compiled SFML (MinGW)
        run: |
          curl -L -o sfml.zip https://github.com/SFML/SFML/releases/download/2.6.1/SFML-2.6.1-windows-gcc-13.1.0-mingw-64-bit.zip
          Expand-Archive sfml.zip -DestinationPath C:\SFML
        shell: pwsh

      - name: Build with Make
        run: |
          # 1. Strip Address Sanitizer (We know this works!)
          (Get-Content Makefile) -replace '-fsanitize=address', '' | Set-Content Makefile

          # 2. Find the exact SFML folder dynamically
          $SFML_DIR = (Get-ChildItem -Path C:\SFML -Directory).FullName

          # 3. Set the C++ paths directly in this active session
          $env:CPATH = "$SFML_DIR\include"
          $env:LIBRARY_PATH = "$SFML_DIR\lib"

          choco install make
          make all
        shell: pwsh

      - name: Copy Files for Release
        run: |
          mkdir -p release

          # Windows g++ sometimes appends .exe automatically, sometimes it doesn't. This safely handles both!
          if (Test-Path badchess.exe) { copy badchess.exe release/ } else { copy badchess release/badchess.exe }

          $SFML_DIR = (Get-ChildItem -Path C:\SFML -Directory).FullName

          copy "$SFML_DIR\bin\sfml-graphics-2.dll" release/
          copy "$SFML_DIR\bin\sfml-window-2.dll" release/
          copy "$SFML_DIR\bin\sfml-system-2.dll" release/

          copy "$SFML_DIR\bin\libgcc_s_seh-1.dll" release/
          copy "$SFML_DIR\bin\libstdc++-6.dll" release/
          copy "$SFML_DIR\bin\libwinpthread-1.dll" release/
          copy "$SFML_DIR\bin\openal32.dll" release/

          xcopy sprites release\sprites /E /I
        shell: pwsh

      - name: Upload Release
        uses: actions/upload-artifact@v4
        with:
          name: badchess-windows
          path: release/
