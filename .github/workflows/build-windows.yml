name: Build for Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # 1. Install perfectly matched Compiler, Make, and SFML via MSYS2
      - name: Setup MSYS2 Environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-sfml
            make

      # 2. Build the game using a native Linux-like bash shell
      - name: Build with Make
        run: |
          # Use standard Linux 'sed' to strip the ASan flag
          sed -i 's/-fsanitize=address//g' Makefile
          make all
        shell: msys2 {0}

      # 3. Package everything into the release folder
      - name: Copy Files for Release
        run: |
          mkdir -p release

          # Copy executable
          if [ -f badchess.exe ]; then cp badchess.exe release/; else cp badchess release/badchess.exe; fi

          # Copy DLLs exactly from the MSYS2 bin folder (Perfect ABI Match!)
          cp /mingw64/bin/sfml-graphics-2.dll release/
          cp /mingw64/bin/sfml-window-2.dll release/
          cp /mingw64/bin/sfml-system-2.dll release/
          cp /mingw64/bin/openal32.dll release/

          cp /mingw64/bin/libgcc_s_seh-1.dll release/
          cp /mingw64/bin/libstdc++-6.dll release/
          cp /mingw64/bin/libwinpthread-1.dll release/

          # Copy the sprites
          cp -r sprites release/
        shell: msys2 {0}

      # 4. Upload the final ZIP!
      - name: Upload Release
        uses: actions/upload-artifact@v4
        with:
          name: badchess-windows
          path: release/
