name: Build for Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # 1. Install Compiler and Make via MSYS2 (DO NOT install sfml here)
      - name: Setup MSYS2 Environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            make
            unzip
            curl

      # 2. Download Official SFML 2.6.1
      - name: Download Legacy SFML
        run: |
          curl -L -o sfml.zip https://github.com/SFML/SFML/releases/download/2.6.1/SFML-2.6.1-windows-gcc-13.1.0-mingw-64-bit.zip
          unzip sfml.zip -d C:/SFML
        shell: msys2 {0}

      # 3. Build the game
      - name: Build with Make
        run: |
          # Strip ASan flag to prevent crash on user's PC
          sed -i 's/-fsanitize=address//g' Makefile

          # Inject the CORRECT SFML folder paths directly into the Makefile!
          sed -i 's|-Iinclude|-Iinclude -IC:/SFML/SFML-2.6.1/include|g' Makefile
          sed -i 's|-lsfml-graphics|-LC:/SFML/SFML-2.6.1/lib -lsfml-graphics|g' Makefile

          make all
        shell: msys2 {0}

      # 4. Package everything
      - name: Copy Files for Release
        run: |
          mkdir -p release

          # Copy executable safely
          if [ -f badchess.exe ]; then cp badchess.exe release/; else cp badchess release/badchess.exe; fi

          # Copy C++ Runtime DLLs from the compiler that actually built it (MSYS2)
          cp /mingw64/bin/libgcc_s_seh-1.dll release/
          cp /mingw64/bin/libstdc++-6.dll release/
          cp /mingw64/bin/libwinpthread-1.dll release/

          # Copy SFML 2.6 DLLs from the exact extracted folder
          cp C:/SFML/SFML-2.6.1/bin/sfml-graphics-2.dll release/
          cp C:/SFML/SFML-2.6.1/bin/sfml-window-2.dll release/
          cp C:/SFML/SFML-2.6.1/bin/sfml-system-2.dll release/
          cp C:/SFML/SFML-2.6.1/bin/openal32.dll release/

          # Copy the sprites
          cp -r sprites release/
        shell: msys2 {0}

      # 5. Upload the final ZIP!
      - name: Upload Release
        uses: actions/upload-artifact@v4
        with:
          name: badchess-windows
          path: release/
