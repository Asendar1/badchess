name: Build for Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        choco install make mingw -y
        vcpkg install sfml:x64-windows-static-md
      shell: pwsh

    - name: Build with Make
      run: |
        $env:CXX = "g++ -Wall -Wextra -Werror -Iinclude -I'C:\vcpkg\installed\x64-windows-static-md\include' -L'C:\vcpkg\installed\x64-windows-static-md\lib' -g -O3"
        make all
      shell: pwsh

    - name: Copy SFML DLLs
      run: |
        mkdir -p release
        copy badchess.exe release/
        $dllPath = "C:\vcpkg\installed\x64-windows-static-md\bin"
        if (Test-Path "$dllPath\sfml-graphics.dll") { copy "$dllPath\sfml-graphics.dll" release/ }
        if (Test-Path "$dllPath\sfml-window.dll") { copy "$dllPath\sfml-window.dll" release/ }
        if (Test-Path "$dllPath\sfml-system.dll") { copy "$dllPath\sfml-system.dll" release/ }
        if (Test-Path "sprites") { xcopy sprites release\sprites /E /I }
      shell: pwsh

    - name: Upload Release
      uses: actions/upload-artifact@v4
      with:
        name: badchess-windows
        path: release/
